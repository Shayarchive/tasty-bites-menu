<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasty Bites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tasty Bites</h1>
        <p>Fresh food, made to order</p>
    </header>

    <main class="menu">
        <div class="item">
            <img src="images/burger.jpg" alt="Double cheeseburger">
            <h2>Classic Burger</h2>
            <p>Two beef patties, cheddar, lettuce and tomato.</p>
            <span class="price">$10.99</span>
        </div>

        <div class="item">
            <img src="images/pizza.jpg" alt="Cheese pizza">
            <h2>Cheese Pizza</h2>
            <p>Stone-baked crust with mozzarella and fresh herbs.</p>
            <span class="price">$12.50</span>
        </div>

        <div class="item">
            <img src="images/salad.jpg" alt="Salad bowl">
            <h2>Garden Bowl</h2>
            <p>Greens, grilled tofu, corn, egg and cucumber.</p>
            <span class="price">$8.75</span>
        </div>
    </main>

</body>
</html>
